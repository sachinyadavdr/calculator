<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main{
            width: 400px;
            height: 600px;
            border: 2px,solid ,black;
            background-color: rgb(102, 205, 207);
            border-radius: 20px;
            
        } 
        label{
            font-size: 20px;
            font-weight: bolder;
            margin-left: 20px;
            
        }
        #input{
            margin-top: 10px;
            font-size: 35px;
            margin-left: 20px;
            width: 350px;
            border-radius: 10px;
        }
        .main_box{
            
            height: 400px;
            border-radius: 10px;
            margin-left: 10px;
            margin-right: 10px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
        }
        .box1{
               height: 50px;
               width: 50px;
               background-color: antiquewhite;
               display: flex;
               justify-content:space-around;
               box-shadow: black;
               font-size: 40px;
               font-weight: bolder;
               text-align: center;
               border-radius: 10px;
               margin-left: 10px;

        }
       


    </style>
</head>
<body>
    <div class="main">
        <h1 style="text-align: center;">Calculetor</h1>
        <label>Enter Number</label>
        <input type="text" placeholder=" Enter number" id="input" readonly>
        <div class="main_box">

<button class="box1" onclick="clearDisplay()">C</button>  
<button class="box1" onclick="add('*')">*</button>
<button class="box1" onclick="add('%')">%</button>
<button class="box1" onclick="add('+')">+</button>
<button class="box1" onclick="add('7')">7</button>
<button class="box1" onclick="add('8')">8</button>
<button class="box1" onclick="add('9')">9</button>
<button class="box1" onclick="add('-')">-</button>
<button class="box1" onclick="add('4')">4</button>
<button class="box1" onclick="add('5')">5</button>
<button class="box1" onclick="add('6')">6</button>
<button class="box1" onclick="add('/')">/</button>
<button class="box1" onclick="add('1')">1</button>
<button class="box1" onclick="add('2')">2</button>
<button class="box1" onclick="add('3')">3</button>
<button class="box1" onclick="calculate()">=</button>
<button class="box1" onclick="add('0')">0</button>
<button class="box1" onclick="add('.')">.</button>

        </div>  

    </div>
        

    </div>
    <script src="script.js"></script>
</body>
</html>
